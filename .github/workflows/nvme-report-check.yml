name: Validate NVMe report contract

on:
  push:
    paths:
      - "AGENTS.md"
      - ".ai/nvme-report/**"
      - "docs/domain-standards.md"
      - "scripts/validate_nvme_report.py"
      - "scripts/extract_nvme_source_text.py"
      - "scripts/build_nvme_reports.py"
      - "scripts/update_nvme_figure_evidence.py"
      - "requirements-nvme-report.txt"
      - "tests/test_validate_nvme_report.py"
      - "DOCS/nvme-spec-report/**"
      - "_posts/*nvme*.md"
      - ".github/workflows/nvme-report-check.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - ".ai/nvme-report/**"
      - "docs/domain-standards.md"
      - "scripts/validate_nvme_report.py"
      - "scripts/extract_nvme_source_text.py"
      - "scripts/build_nvme_reports.py"
      - "scripts/update_nvme_figure_evidence.py"
      - "requirements-nvme-report.txt"
      - "tests/test_validate_nvme_report.py"
      - "DOCS/nvme-spec-report/**"
      - "_posts/*nvme*.md"
      - ".github/workflows/nvme-report-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate report contract
        run: |
          python3 -B -c "import ast, pathlib; [ast.parse(pathlib.Path(path).read_text(encoding='utf-8'), filename=path) for path in ('scripts/build_nvme_reports.py', 'scripts/extract_nvme_source_text.py', 'scripts/update_nvme_figure_evidence.py', 'scripts/validate_nvme_report.py')]"
          python3 -B scripts/build_nvme_reports.py
          git diff --exit-code -- .ai/nvme-report DOCS/nvme-spec-report _posts scripts
          python3 -B scripts/validate_nvme_report.py --phase auto

      - name: Run validator tests
        run: python3 -B -m unittest discover -s tests -p 'test_validate_nvme_report.py' -v
